    ErrorCode:
      description: 统一业务错误码。HTTP 状态码与业务错误码分离（CODEBUDDY.md 错误响应规范）。
      enum:
      - VALIDATION_ERROR
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - DOCUMENT_NOT_FOUND
      - ENTITY_NOT_FOUND
      - FILE_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - KG_VERSION_NOT_ACTIVE
      - KG_TENANT_LEAK
      - TASK_INTERRUPTED
      - NOT_IMPLEMENTED
      - INTERNAL_ERROR
      - HTTP_ERROR
      title: ErrorCode
      type: string
      x-enum-descriptions:
        DOCUMENT_NOT_FOUND: 文档不存在或未在本租户可见范围内。
        ENTITY_NOT_FOUND: 实体不存在或不属于当前 active kg_version；与跨租户 403 区分。
        FILE_TOO_LARGE: 上传文件超过 MAX_UPLOAD_SIZE_MB（默认 100MB，M1 验收 2）。
        FORBIDDEN: 跨租户访问被拒（ADR-0003：org_id 不符），非本租户资源一律拒绝。
        HTTP_ERROR: 未在错误码表中登记的 HTTP 状态兜底，保留原始 HTTP 状态语义。
        INTERNAL_ERROR: 未预期的服务端异常，已记录日志（含 trace_id）。
        KG_TENANT_LEAK: 跨租户子图泄漏检测到（ADR-0003 §4，Sprint 5 批次 B）。active kg_version 内任一 Entity 节点 org_id 与当前 org_id 不一致——属数据质量事故伪装为正常结论，由 /agent/query 路由层转 403。
        KG_VERSION_NOT_ACTIVE: 请求显式指定了非 active 的 kg_version（writing / failed / superseded），按 ADR-0002 §3.2 一律拒绝，严禁静默降级到最新版。
        NOT_FOUND: 通用资源不存在（含未注册路由）。
        NOT_IMPLEMENTED: 基础设施不可用（Neo4j 图谱存储不可用（连不上 / 查询失败）/ LLM 未配置或装配失败）时返回 501，**不**表示「接口未实现」。
        TASK_INTERRUPTED: 进程重启导致在途任务被 TaskManager.recover() 回收置 failed（ADR-0001 §3.2）。
        UNAUTHORIZED: 缺少或无法解析认证态（Bearertoken / 开发态请求头）。
        UNSUPPORTED_MEDIA_TYPE: 上传文件 MIME 不在白名单（M1 验收 3）。
        VALIDATION_ERROR: 请求体 / 查询参数 / 路径参数未通过 Pydantic 校验。
      x-enum-sources:
        DOCUMENT_NOT_FOUND: M1 §5.4
        ENTITY_NOT_FOUND: Sprint 5 批次 C / plans §4.2 批次 C
        FILE_TOO_LARGE: M1 §3 验收 2
        FORBIDDEN: ADR-0003 §3.3 / M5 §3 验收 1
        HTTP_ERROR: CODEBUDDY.md 错误响应规范
        INTERNAL_ERROR: CODEBUDDY.md 错误响应规范
        KG_TENANT_LEAK: ADR-0003 §4 / Sprint 5 批次 B
        KG_VERSION_NOT_ACTIVE: ADR-0002 §3.2 / M3 §4.1
        NOT_FOUND: CODEBUDDY.md 错误响应规范
        NOT_IMPLEMENTED: backend/CODEBUDDY.md §1.1 故障语义边界 / ADR-0002 §3.2
        TASK_INTERRUPTED: ADR-0001 §3.2
        UNAUTHORIZED: M5 §3 验收 1
        UNSUPPORTED_MEDIA_TYPE: M1 §3 验收 3
        VALIDATION_ERROR: CODEBUDDY.md 错误响应规范
    ErrorResponse:
      description: '统一错误响应体（**所有** 4xx / 5xx 均使用本结构）。


        来源：`CODEBUDDY.md`「错误响应规范」。'
      example:
        code: KG_VERSION_NOT_ACTIVE
        detail:
          kg_version: 20260320T1430Z-01H9X9
          version_status: writing
        message: Requested kg_version is not active
        trace_id: 5f2c1b7e-9d4a-4c1e-8f3b-6a0d2e5c7b91
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: 业务错误码（HTTP 状态码与业务错误码分离）
          examples:
          - VALIDATION_ERROR
          - FORBIDDEN
          - KG_VERSION_NOT_ACTIVE
        detail:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: 结构化补充信息；敏感字段（文件名原文 / error_detail / pii_flags）严禁出现在此
          title: Detail
        message:
          description: 面向调用方的简短英文摘要，便于日志检索
          title: Message
          type: string
        trace_id:
          description: 与响应头 X-Trace-Id 一致，贯穿 M1–M5 全链路
          title: Trace Id
          type: string
      required:
      - code
      - message
      - trace_id
      title: ErrorResponse
      type: object
    GraphEdge:
      properties:
        id:
          title: Id
          type: string
        properties:
          additionalProperties: true
          description: 关系属性（如 `share_pct` / `since` / `amount` / `role`），不含证据原文
          title: Properties
          type: object
        source:
          description: 起点节点 id
          title: Source
          type: string
        target:
          description: 终点节点 id
          title: Target
          type: string
        type:
          description: 关系类型（M2 §4.2），含桥梁抽取的实体↔实体类关系
          enum:
          - HAS_CHUNK
          - MENTIONS
          - SUPPORTED_BY
          - AFFILIATED_WITH
          - SUPPLIES_TO
          - PARTY_TO
          - HAS_FINANCIAL_INDICATOR
          - OPERATES_SEGMENT
          - RELATED
          title: Type
          type: string
      required:
      - id
      - type
      - source
      - target
      title: GraphEdge
      type: object
    GraphNode:
      description: '图谱节点。


        **刻意不含** `pii_flags`：M2 §5.3 明确禁止该字段外泄。'
      properties:
        canonical_name:
          anyOf:
          - type: string
          - type: 'null'
          description: '`:Entity.canonical_name`（消解后的标准名）'
          title: Canonical Name
        confidence:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: 抽取置信度
          title: Confidence
        entity_type:
          anyOf:
          - type: string
          - type: 'null'
          description: '`:Entity.type`（公司 / 自然人 / 法人 / 地址 / 证件号等）'
          title: Entity Type
        id:
          title: Id
          type: string
        kg_version:
          description: 节点所属图谱版本，必须等于响应的 `kg_version`
          title: Kg Version
          type: string
        label:
          enum:
          - Document
          - Chunk
          - Entity
          - Evidence
          title: Label
          type: string
      required:
      - id
      - label
      - kg_version
      title: GraphNode
      type: object
    GraphOverviewEdge:
      description: '`GET /graph/overview` 边轻量投影。'
      properties:
        id:
          title: Id
          type: string
        relation:
          description: 关系名（来自 Neo4j ``type(r)``）
          title: Relation
          type: string
        source:
          description: 起点节点 id
          title: Source
          type: string
        target:
          description: 终点节点 id
          title: Target
          type: string
      required:
      - id
      - source
      - target
      - relation
      title: GraphOverviewEdge
      type: object
    GraphOverviewNode:
      description: '`GET /graph/overview` 节点轻量投影。


        仅含前端力导向图渲染所需的最小字段集合，**不含** ``label`` /

        ``confidence`` / ``pii_flags`` 等（避免演示字段污染契约可溯源链）。'
      properties:
        category:
          description: 前端图例分类（4 类）
          enum:
          - topic
          - norm
          - org
          - system
          title: Category
          type: string
        id:
          description: Neo4j 节点 id（`:Entity.id`）
          title: Id
          type: string
        name:
          description: '`:Entity.canonical_name`'
          title: Name
          type: string
        seed_x:
          maximum: 1.0
          minimum: 0.0
          title: Seed X
          type: number
        seed_y:
          maximum: 1.0
          minimum: 0.0
          title: Seed Y
          type: number
        type:
          description: '`:Entity.type`（原始字符串）'
          title: Type
          type: string
        weight:
          description: 相对权重，决定节点半径
          maximum: 10.0
          minimum: 0.0
          title: Weight
          type: number
      required:
      - id
      - name
      - type
      - category
      - weight
      - seed_x
      - seed_y
      title: GraphOverviewNode
      type: object
    GraphOverviewResponse:
      description: '`GET /graph/overview` 响应：全局图谱概览。


        节点 / 边上限 500（与 ``DocumentGraphResponse`` 对齐），超限时

        ``truncated = true`` —— 前端禁用「全部展开」以避免误以为是真实全量。'
      example:
        doc_count: 27
        edges:
        - id: r-001
          relation: 包含
          source: e-001
          target: e-002
        entity_count: 1428
        kg_version: 20260320T1430Z-01H9X9ABCDEF
        nodes:
        - category: topic
          id: e-001
          name: 数据安全合规
          seed_x: 0.14
          seed_y: 0.38
          type: 核心主题
          weight: 1.65
        relation_count: 3604
        trace_id: 5f2c1b7e-9d4a-4c1e-8f3b-6a0d2e5c7b91
        truncated: false
      properties:
        doc_count:
          description: 当前租户下有 active kg_version 的文档数
          minimum: 0.0
          title: Doc Count
          type: integer
        edges:
          items:
            $ref: '#/components/schemas/GraphOverviewEdge'
          title: Edges
          type: array
        entity_count:
          description: active kg_version 内的实体数（总）
          minimum: 0.0
          title: Entity Count
          type: integer
        kg_version:
          description: active kg_version 版本号
          title: Kg Version
          type: string
        nodes:
          items:
            $ref: '#/components/schemas/GraphOverviewNode'
          title: Nodes
          type: array
        relation_count:
          description: active kg_version 内的关系数（总）
          minimum: 0.0
          title: Relation Count
          type: integer
        trace_id:
          title: Trace Id
          type: string
        truncated:
          default: false
          description: 是否因超过 500 节点上限被截断
          title: Truncated
          type: boolean
      required:
      - doc_count
      - entity_count
      - relation_count
      - kg_version
      - nodes
      - edges
      - trace_id
      title: GraphOverviewResponse
      type: object
    HealthCheckStatus:
      properties:
        database:
          description: 数据库连通性。SQLite 兜底期间仅探测 `SELECT 1`，不代表 RLS 已生效
          enum:
          - up
          - down
          title: Database
          type: string
      required:
      - database
      title: HealthCheckStatus
      type: object
    HealthResponse:
      description: '健康检查响应。


        **本接口豁免租户上下文**：不要求认证、不返回任何业务数据。'
      example:
        checks:
          database: up
        status: ok
        time: '2026-09-16T08:30:00Z'
        trace_id: 5f2c1b7e-9d4a-4c1e-8f3b-6a0d2e5c7b91
        version: 1.0.0
      properties:
        checks:
          $ref: '#/components/schemas/HealthCheckStatus'
        status:
          description: '`ok` = 全部依赖正常；`degraded` = 依赖异常但进程可服务（HTTP 仍为 200）'
          enum:
          - ok
          - degraded
          title: Status
          type: string
        time:
          description: 服务端 UTC 时间
          format: date-time
          title: Time
          type: string
        trace_id:
          title: Trace Id
          type: string
        version:
          description: 契约版本，与 openapi.yaml 的 info.version 一致
          title: Version
          type: string
      required:
      - status
      - version
      - checks
      - time
      - trace_id
      title: HealthResponse
      type: object
    KgVersionActivationResponse:
      description: '`POST /graph/versions/{version}/activate` 响应（Sprint 6.3）。


        **两套词汇的显式映射（真机实测）**：PG ``kg_versions`` 为真源，用 ``ready``

        表达「可消费」；Neo4j ``:KgVersion`` 只是镜像，用 ``active`` 表达同一语义。

        两个字段同时返回，**不**合并成一个模糊的 ``status``，免得前端误以为存在

        两个不同的状态机。'
      example:
        activated_at: '2026-09-22T12:34:56.789012+00:00'
        graph_mirror_status: active
        source_status: ready
        superseded_versions:
        - 20260917T090000Z-phase09
        trace_id: 5f2c1b7e-9d4a-4c1e-8f3b-6a0d2e5c7b91
        version: v-3e381d36
      properties:
        activated_at:
          description: 激活时刻（UTC ISO-8601）
          title: Activated At
          type: string
        graph_mirror_status:
          description: Neo4j `:KgVersion.status` 镜像值（恒为 `active`）
          title: Graph Mirror Status
          type: string
        source_status:
          description: PG 真源状态（active 语义在本表中写作 `ready`）
          title: Source Status
          type: string
        superseded_versions:
          description: 本次被置为 `superseded` 的历史版本（Neo4j 镜像侧；可为空）
          items:
            type: string
          title: Superseded Versions
          type: array
        trace_id:
          title: Trace Id
          type: string
        version:
          description: 被激活的 kg_version 版本号
          title: Version
          type: string
      required:
      - version
      - source_status
      - graph_mirror_status
      - activated_at
      - trace_id
      title: KgVersionActivationResponse
      type: object
    TokenUsage:
      description: 'LLM token 用量（对齐 DeepSeek / OpenAI 兼容 API 的 `usage` 格式）。


        按「实测结果反哺规则」：骨架链路 / LLM 未返回 usage 时，

        上层字段 ``AgentQueryResponse.token_usage`` 置 ``null``，**严禁造数据**。'
      properties:
        completion_tokens:
          default: 0
          description: 输出 token 数
          minimum: 0.0
          title: Completion Tokens
          type: integer
        prompt_tokens:
          default: 0
          description: 输入 token 数
          minimum: 0.0
          title: Prompt Tokens
          type: integer
        total_tokens:
          default: 0
          description: 总 token 数
          minimum: 0.0
          title: Total Tokens
          type: integer
      title: TokenUsage
      type: object
    UploadResponse:
      description: '`POST /api/v1/documents/upload` 响应（M1 验收 1）。'
      example:
        status: pending
        task_id: 3f1a9c2e-7b45-4d8a-9e01-2c4f6a8b0d11
        trace_id: 5f2c1b7e-9d4a-4c1e-8f3b-6a0d2e5c7b91
      properties:
        status:
          const: pending
          description: 上传受理后恒为 `pending`（异步执行）
          title: Status
          type: string
        task_id:
          description: 任务 id（UUIDv4），与 `documents.id` 一致；M2 抽取任务复用同一 id 空间
          format: uuid
          title: Task Id
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - task_id
      - status
      - trace_id
      title: UploadResponse
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: 认证态来源。Sprint 1 支持 `Bearer dev.<org_id>.<actor_id>`；Sprint 3 起由 M5 `POST /auth/login` 签发的 JWT 取代。
      scheme: bearer
      type: http
info:
  description: "GraphRAG-Agent 后端 API（契约 v1.0，Sprint 1）。\n\n## 租户隔离（ADR-0003，**所有接口强制**）\n- `org_id` **只能**来自认证态：`Authorization: Bearer <token>` 解析结果；\n  **严禁**从请求 body / query 读取。\n- 开发态兜底（`ALLOW_DEV_ORG_HEADER=true` 且非生产）可用 `X-Org-Id` / `X-Actor-Id` 请求头，\n  该兜底 **Sprint 3 必须移除**。\n- 跨租户访问一律 `403 FORBIDDEN`；`org_id` 过滤**必须**经 ORM / 统一注入，禁止裸写 SQL。\n- **例外**：`GET /api/v1/health` 不要求认证、不返回任何业务数据。\n\n## trace_id（M1 验收 7 / M5 §5.3）\n- 请求头 `X-Trace-Id` 可选透传（必须是合法 UUID），缺失则服务端生成 UUIDv4；\n- 响应头 `X-Trace-Id` 恒回显；错误体 `trace_id` 与之一致。\n\n## 统一错误响应\n所有 4xx / 5xx 均为 `{code, message, detail, trace_id}`，`code` 取自 `ErrorCode` 枚举。\n\n## 图谱版本一致性（ADR-0002）\n查询层只认 `kg_version.status = active`。请求显式指定非 active 版本时，\n一律返回 `409 KG_VERSION_NOT_ACTIVE`，**严禁静默降级**到最新版本。\n\n## 实现状态（Sprint 4）\n五个接口均已实装真实链路；`501 NOT_IMPLEMENTED` 不再表示「接口未实现」，而是\n**基础设施故障**（Neo4j 不可用 / LLM 未配置或装配失败）的统一出口。"
  title: GraphRAG-Agent Backend API
  version: 1.3.0
openapi: 3.1.0
paths:
  /api/v1/affiliation/detect:
    post:
      description: '对 `doc_ids` 覆盖的文档集合跑 M4 规则型算法（**当前只做两类**：「同一法人跨公司」/「同一地址跨公司」），检出结果写 `affiliation_suspicions`。


        **异步语义**：请求只保证任务落库为 `pending` 并已投递，随即返回 **202** （`task_id` + `status`）；真值在 PG `affiliation_tasks` 表里，请用 `GET /affiliation/tasks/{task_id}` 轮询。


        **每次提交都新建一条任务**（决策 B3：幂等由任务承载，不是「复用上次的疑点」）——重复提交会得到第二批疑点，前端可用 `task_id` 区分批次。


        **错误分支**：`doc_ids` 为空 → 400 `VALIDATION_ERROR`；文档不存在 → 404 `DOCUMENT_NOT_FOUND`；**任一文档跨租户 → 403**（不静默剔除）。'
      operationId: detectAffiliation
      parameters:
      - description: 【仅开发态兜底】租户 id。仅当 ALLOW_DEV_ORG_HEADER=true 且非生产环境时生效；Sprint 3 接入 M5 登录后必须移除（ADR-0003 §3.3：org_id 严禁来自 body / query）。
        in: header
        name: X-Org-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 【仅开发态兜底】租户 id。仅当 ALLOW_DEV_ORG_HEADER=true 且非生产环境时生效；Sprint 3 接入 M5 登录后必须移除（ADR-0003 §3.3：org_id 严禁来自 body / query）。
          title: X-Org-Id
      - description: 【仅开发态兜底】操作者 id，缺省取 DEFAULT_ACTOR_ID；Sprint 3 起由认证态提供。
        in: header
        name: X-Actor-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 【仅开发态兜底】操作者 id，缺省取 DEFAULT_ACTOR_ID；Sprint 3 起由认证态提供。
          title: X-Actor-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliationDetectRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliationDetectResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求校验失败（`VALIDATION_ERROR`），`detail.errors` 给出字段级原因
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 缺少或无法解析认证态（`UNAUTHORIZED`）
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 跨租户访问被拒（`FORBIDDEN`，ADR-0003 §3.3 / M5 §3 验收 1）
      security:
      - bearerAuth: []
      summary: 提交一次关联交易检测（异步，202）
      tags:
      - affiliation
  /api/v1/affiliation/suspicions:
    get:
      description: '返回当前租户的疑点列表，每条含 `entities` / `entity_names` / `evidence`（引用覆盖率 = 100%：产不出原文证据的命中在算法层就被丢弃，**不会**出现在这里）。


        **批次口径**（决策 B2）：不带 `task_id` 时返回**最近一条 completed 任务**产出的疑点——重复跑检测会产生多批疑点，靠 `created_at` 猜「最新」在并发 / 补跑下不稳，故用 `task_id` 列精确归属。


        **不支持分页**（spec §5.5 未规定，不引入无消费者的 `page` / `page_size`）；租户从未跑过检测时返回**空列表** + `task_id = null`（200，非 404）。'
      operationId: listAffiliationSuspicions
      parameters:
      - description: 指定批次（任务 id）；缺省=最近一条 completed 任务
        in: query
        name: task_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: 指定批次（任务 id）；缺省=最近一条 completed 任务
          title: Task Id
      - description: 按疑点类型过滤：`shared_legal_rep` / `shared_address`
        in: query
        name: type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按疑点类型过滤：`shared_legal_rep` / `shared_address`
          title: Type
      - description: 按严重度过滤：`high` / `medium` / `low`
        in: query
        name: severity
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按严重度过滤：`high` / `medium` / `low`
          title: Severity
      - description: 按复核状态过滤：`open` / `confirmed` / `dismissed`
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按复核状态过滤：`open` / `confirmed` / `dismissed`
          title: Status
      - description: 【仅开发态兜底】租户 id。仅当 ALLOW_DEV_ORG_HEADER=true 且非生产环境时生效；Sprint 3 接入 M5 登录后必须移除（ADR-0003 §3.3：org_id 严禁来自 body / query）。
        in: header
        name: X-Org-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 【仅开发态兜底】租户 id。仅当 ALLOW_DEV_ORG_HEADER=true 且非生产环境时生效；Sprint 3 接入 M5 登录后必须移除（ADR-0003 §3.3：org_id 严禁来自 body / query）。
          title: X-Org-Id
      - description: 【仅开发态兜底】操作者 id，缺省取 DEFAULT_ACTOR_ID；Sprint 3 起由认证态提供。
        in: header
        name: X-Actor-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 【仅开发态兜底】操作者 id，缺省取 DEFAULT_ACTOR_ID；Sprint 3 起由认证态提供。
          title: X-Actor-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliationSuspicionListResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求校验失败（`VALIDATION_ERROR`），`detail.errors` 给出字段级原因
        '401':
          content:
            application/json:
              schema:
