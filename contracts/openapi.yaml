    DocumentChunkResponse:
      description: '`GET /api/v1/documents/{id}/chunks/{chunk_id}` 响应：单个原文片段。


        **Q2 拍板**：溯源走**独立端点**回查原文，chunk 全文**不**塞进 `Citation`

