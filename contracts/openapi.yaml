# 本文件由 backend/scripts/export_openapi.py 自动生成，请勿手工编辑。
# 真源：backend/app/schemas/*.py（Pydantic 模型）。
# 重新生成：cd backend && uv run python scripts/export_openapi.py
components:
  schemas:
    AffiliationDetectRequest:
      description: '`POST /affiliation/detect` 请求体。


        `doc_ids` 是本次检测要覆盖的文档集合；**空则为 400**（校验在 Pydantic 层完成）。

        文档是否属于当前租户由**服务层**按 `documents.org_id` 校验——跨租户文档 → **403**

        （ADR-0003），不静默剔除。


        **注意**：`org_id` **严禁**出现在请求体里（ADR-0003 §3.3，只认 `X-Org-Id` 请求头）。'
      example:
        doc_ids:
        - 3f1a9c2e-7b45-4d8a-9e01-2c4f6a8b0d11
        - b7d0c4a1-8e2f-4c6b-9a35-1f7e2d9c4b08
      properties:
        doc_ids:
          description: 纳入本次检测的文档 id 列表（须均属当前租户，至少一个）
          items:
            format: uuid
            type: string
          maxItems: 200
          minItems: 1
          title: Doc Ids
          type: array
      required:
      - doc_ids
      title: AffiliationDetectRequest
      type: object
    AffiliationDetectResponse:
      description: '`POST /affiliation/detect` 的 **202** 响应（spec §5.5）。


        检测异步执行，不阻塞请求。任务状态的**唯一真值源是 PG `affiliation_tasks` 表**

        （ADR-0001 要求 1：严禁保存于进程内存，进程重启靠 `recover()` 回收）——前端用

        `task_id` 轮询 `GET /affiliation/tasks/{id}`，**不**依赖任何进程内状态。'
      example:
        status: pending
        task_id: 9a4b2c6d-1e3f-4a8b-8c2d-5e7f0a1b3c5d
        trace_id: 5f2c1b7e-9d4a-4c1e-8f3b-6a0d2e5c7b91
      properties:
        status:
          description: 任务初始状态，恒为 `pending`
          enum:
          - pending
          - processing
          - completed
          - failed
          title: Status
          type: string
        task_id:
          description: '`affiliation_tasks.id`，后续轮询状态用'
          format: uuid
          title: Task Id
          type: string
        trace_id:
          description: 贯穿本次检测与所产疑点的 trace_id
          title: Trace Id
          type: string
      required:
      - task_id
      - status
      - trace_id
      title: AffiliationDetectResponse
      type: object
    AffiliationEvidenceRef:
      description: '一条原文证据引用（复用 S6 的 `:Chunk` 反查链路）。


        来源：`:Subject` / `:LegalPerson` / `:Address` 的 `source_entity_ids` → `:Entity`

        → `(:Chunk)-[:MENTIONS]->`；**不**是 LLM 自报的实体偏移。`doc_id` 为 `null` 表示

        该 chunk 未挂 `:Document`（**不**伪造 UUID）。'
      example:
        char_end: 764
        char_start: 0
        chunk_id: chunk-581e8912827d
        doc_id: 3f1a9c2e-7b45-4d8a-9e01-2c4f6a8b0d11
        node_id: v-s71a:sub:8f2c1b7e9d4a4c1e
        page: 12
        text: 甲方的法定代表人为缪建民……
      properties:
        char_end:
          description: 片段在页内结束字符偏移
          minimum: 0.0
          title: Char End
          type: integer
        char_start:
          description: 片段在页内起始字符偏移
          minimum: 0.0
          title: Char Start
          type: integer
        chunk_id:
          description: 原文片段 id（`chunk-<12 hex>`）
          title: Chunk Id
          type: string
        doc_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: 片段所属文档 id；未挂载为 `null`
          title: Doc Id
        node_id:
          description: 该证据支撑的主体层节点 id（`:Subject` / `:LegalPerson` / `:Address`）
          title: Node Id
          type: string
        page:
          anyOf:
          - type: integer
          - type: 'null'
          description: 片段所在页码；未知为 `null`
          title: Page
        text:
          description: 片段原文（用于前端高亮回显）
          title: Text
          type: string
      required:
      - node_id
      - chunk_id
      - char_start
      - char_end
      - text
      title: AffiliationEvidenceRef
      type: object
    AffiliationSuspicionItem:
      description: '一条疑点（结构对齐 M4 §3 验收 3：`{type, severity, entities[], evidence[]}`）。


        **引用覆盖率 = 100%** 是硬要求：产不出 `evidence` 的命中在算法层就被丢弃

        （`affiliation_suspicion_dropped_no_evidence`），因此这里的 `evidence` **非空**。'
      example:
        created_at: '2026-09-24T10:16:12Z'
        entities:
        - v-s71a:sub:8f2c1b7e9d4a4c1e
        - v-s71a:sub:1d4e7a9b3c6f2e80
        entity_names:
        - 招商局集团有限公司
        - 招商局轮船有限公司
        evidence: []
        id: 2c6d1e3f-9a4b-4a8b-8c2d-5e7f0a1b3c5d
        kg_version: v-s71a-fe1c4dc3
        severity: medium
        status: open
        suspicion_type: shared_legal_rep
        task_id: 9a4b2c6d-1e3f-4a8b-8c2d-5e7f0a1b3c5d
        trace_id: 5f2c1b7e-9d4a-4c1e-8f3b-6a0d2e5c7b91
      properties:
        created_at:
          description: 疑点落库时间
          format: date-time
          title: Created At
          type: string
        entities:
          description: 涉及节点 id：[主体A, 主体B, 共享节点]
          items:
            type: string
          title: Entities
          type: array
        entity_names:
          description: 与 `entities` 对应的名称，仅用于展示；判重与落库以 id 为准
          items:
            type: string
          title: Entity Names
          type: array
        evidence:
          description: 原文证据引用列表（非空：无证据的疑点不会落库）
          items:
            $ref: '#/components/schemas/AffiliationEvidenceRef'
          title: Evidence
          type: array
        id:
          description: 疑点 id（`affiliation_suspicions.id`）
          format: uuid
          title: Id
          type: string
        kg_version:
          description: 疑点所属的图谱版本
          title: Kg Version
          type: string
        reviewed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 复核时间；未复核为 `null`
          title: Reviewed At
        reviewed_by:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: 复核人（`X-Actor-Id`；M5 落地后改为 token 主体）
          title: Reviewed By
        severity:
          description: 严重度
          enum:
          - high
          - medium
          - low
          title: Severity
          type: string
        status:
          description: 复核状态；初始恒为 `open`
          enum:
          - open
          - dismissed
          - confirmed
          title: Status
          type: string
        suspicion_type:
          description: 疑点类型
          enum:
          - shared_address
          - shared_legal_rep
          title: Suspicion Type
          type: string
        task_id:
          description: 产出该疑点的任务 id（批次 B 决策 B2 新增列；用于回答「返回哪一批疑点」）
          format: uuid
          title: Task Id
          type: string
        trace_id:
          description: 与产出它的任务 trace_id 同值
          title: Trace Id
          type: string
      required:
      - id
      - task_id
      - suspicion_type
      - severity
      - entities
      - entity_names
      - evidence
      - kg_version
      - status
      - created_at
      - trace_id
      title: AffiliationSuspicionItem
      type: object
    AffiliationSuspicionListResponse:
      description: '`GET /affiliation/suspicions` 响应（spec §5.5）。


        **不支持分页**（spec 未规定，不引入无消费者的 `page` / `page_size`）；

        默认返回当前租户**最近一条 completed 任务**产出的疑点（批次 B 决策 B2），

        显式传 `task_id` 则按该任务过滤。'
      example:
        items: []
        task_id: 9a4b2c6d-1e3f-4a8b-8c2d-5e7f0a1b3c5d
        total: 0
        trace_id: 5f2c1b7e-9d4a-4c1e-8f3b-6a0d2e5c7b91
      properties:
        items:
          description: 疑点列表
          items:
            $ref: '#/components/schemas/AffiliationSuspicionItem'
          title: Items
          type: array
        task_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: 本次结果对应的任务 id；当前租户从未跑过检测时为 `null`
          title: Task Id
        total:
          description: 疑点条数（与 `len(items)` 一致）
          minimum: 0.0
          title: Total
          type: integer
        trace_id:
          description: 本次请求的 trace_id
          title: Trace Id
          type: string
      required:
      - items
      - total
      - trace_id
      title: AffiliationSuspicionListResponse
      type: object
    AffiliationSuspicionPatchRequest:
      description: '`PATCH /affiliation/suspicions/{id}` 请求体（spec §5.5）。


        只允许 `dismissed` / `confirmed`：`open` 不是合法输入（不允许把已复核的疑点"改回"未复核，

        避免复核留痕被抹掉）。'
      example:
        status: confirmed
      properties:
        status:
          description: 目标复核状态
          enum:
          - dismissed
          - confirmed
          title: Status
          type: string
      required:
      - status
      title: AffiliationSuspicionPatchRequest
      type: object
    AffiliationSuspicionPatchResponse:
      description: '`PATCH /affiliation/suspicions/{id}` 响应（200）。


        只回写状态相关字段——复核动作不改变疑点本体（`entities` / `evidence` 一律不变）。'
      example:
        id: 2c6d1e3f-9a4b-4a8b-8c2d-5e7f0a1b3c5d
        reviewed_at: '2026-09-24T11:02:45Z'
        reviewed_by: 00000000-0000-4000-8000-000000000001
        status: confirmed
        trace_id: 5f2c1b7e-9d4a-4c1e-8f3b-6a0d2e5c7b91
      properties:
        id:
          description: 疑点 id
          format: uuid
          title: Id
          type: string
        reviewed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 复核时间
          title: Reviewed At
        reviewed_by:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: 复核人 id
          title: Reviewed By
        status:
          description: 更新后的复核状态
          enum:
          - open
          - dismissed
          - confirmed
          title: Status
          type: string
        trace_id:
          description: 本次请求的 trace_id
          title: Trace Id
          type: string
      required:
      - id
      - status
      - trace_id
      title: AffiliationSuspicionPatchResponse
      type: object
    AffiliationTaskResponse:
      description: '`GET /affiliation/tasks/{id}` 响应（spec §5.5）。


        任务不存在 → 404；**跨租户 → 403**（ADR-0003：不泄露资源存在性也不返回空 200）。'
      example:
        completed_at: '2026-09-24T10:16:12Z'
        created_at: '2026-09-24T10:15:30Z'
        doc_ids:
        - 3f1a9c2e-7b45-4d8a-9e01-2c4f6a8b0d11
        result_summary:
          by_type:
            shared_address: 9
            shared_legal_rep: 1
          top_5_severity:
          - medium
          total: 10
        status: completed
        task_id: 9a4b2c6d-1e3f-4a8b-8c2d-5e7f0a1b3c5d
        trace_id: 5f2c1b7e-9d4a-4c1e-8f3b-6a0d2e5c7b91
        updated_at: '2026-09-24T10:16:12Z'
      properties:
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 进入 `completed` 的时间；未完成为 `null`
          title: Completed At
        created_at:
          description: 任务创建时间
          format: date-time
          title: Created At
          type: string
        doc_ids:
          description: 本次检测覆盖的文档 id 列表
          items:
            format: uuid
            type: string
          title: Doc Ids
          type: array
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          description: 失败错误码（`TASK_INTERRUPTED` 表示进程重启回收，ADR-0001 §3.2）
          title: Error Code
        result_summary:
          anyOf:
          - $ref: '#/components/schemas/AffiliationTaskResultSummary'
          - type: 'null'
          description: 完成后的摘要；`pending` / `processing` / `failed` 时为 `null`
        status:
          description: 任务状态（PG 为唯一真值源）
          enum:
          - pending
          - processing
          - completed
          - failed
          title: Status
          type: string
        task_id:
          description: 任务 id（与 `affiliation_tasks.id` 一致）
          format: uuid
          title: Task Id
          type: string
        trace_id:
          description: 任务级 trace_id（与它产出的每条疑点同值）
          title: Trace Id
          type: string
        updated_at:
          description: 最近一次状态变更时间
          format: date-time
          title: Updated At
          type: string
      required:
      - task_id
      - status
      - doc_ids
      - created_at
      - updated_at
      - trace_id
      title: AffiliationTaskResponse
      type: object
    AffiliationTaskResultSummary:
      description: '任务完成后的结果摘要（spec §4.4 `result_summary`）。


        未完成 / 失败的任务**不返回**该结构（字段为 `null`），失败信息走 `error_code`。'
      example:
        by_type:
          shared_address: 9
          shared_legal_rep: 1
        top_5_severity:
        - medium
        - medium
        - medium
        - medium
        - medium
        total: 10
      properties:
        by_type:
          additionalProperties:
            type: integer
          description: '按疑点类型统计（`{type: 条数}`），键取自本次实际产出的 `suspicion_type`'
          title: By Type
          type: object
        top_5_severity:
          description: 按严重度排序的前 5 条疑点的 `severity`（不足 5 条则按实际条数）
          items:
            type: string
          title: Top 5 Severity
          type: array
        total:
          description: 检出的疑点总条数
          minimum: 0.0
          title: Total
          type: integer
      required:
      - total
      - by_type
      - top_5_severity
      title: AffiliationTaskResultSummary
      type: object
    AgentQueryRequest:
      description: '`POST /api/v1/agent/query` 请求体（M3 §4.1）。'
      example:
        kg_version: 20260320T1430Z-01H9X9ABCDEF
        question: A 公司的子公司的供应商是否同时是 B 公司的股东？
        scope: cross_doc
      properties:
        doc_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: 限定文档 id，仅 `scope = single_doc` 时使用
          title: Doc Id
        kg_version:
          anyOf:
          - type: string
          - type: 'null'
          description: 指定图谱版本，缺省取最新 active 版本。若指定版本的 status ≠ active（writing / failed / superseded），一律返回 409 KG_VERSION_NOT_ACTIVE，严禁静默降级（ADR-0002 §3.2）
          title: Kg Version
        question:
          description: 用户问题（单轮，不做多轮上下文）
          minLength: 1
          title: Question
          type: string
        scope:
          default: cross_doc
          description: 检索范围；`single_doc` 时 `doc_id` 必填
          enum:
          - single_doc
          - cross_doc
          title: Scope
          type: string
      required:
      - question
      title: AgentQueryRequest
      type: object
    AgentQueryResponse:
      description: '`POST /api/v1/agent/query` 响应（M3 §4.2）。


        Sprint 4 阶段 10.0 批次 A 扩展（Sprint 3 缺口 1 偿还）：

        新增 ``kg_nodes`` / ``kg_relations`` / ``token_usage`` 三字段，

        供前端 p03「引用证据」面板展示图谱证据与 token 用量。'
      example:
        answer: '是。示例子公司 A 的供应商 C 同时持有 B 公司 12% 股权 [source: doc-9/page-3/chunk-12]'
        citations:
        - char_offset: 480
          chunk_id: chunk-12
          doc_id: 3f1a9c2e-7b45-4d8a-9e01-2c4f6a8b0d11
          page: 3
          snippet: ……供应商 C 持有本公司 12% 股权……
        confidence: high
        kg_nodes:
        - canonical_name: 示例科技有限公司
          confidence: 0.93
          entity_type: 公司
          id: e-001
          kg_version: 20260320T1430Z-01H9X9ABCDEF
          label: Entity
        kg_relations:
        - id: r-001
          properties:
            share_pct: 51.0
          source: e-001
          target: e-002
          type: AFFILIATED_WITH
        kg_version: 20260320T1430Z-01H9X9ABCDEF
        refused: false
        route: m3_graphqa
        token_usage:
          completion_tokens: 256
          prompt_tokens: 2048
          total_tokens: 2304
        trace_id: 5f2c1b7e-9d4a-4c1e-8f3b-6a0d2e5c7b91
      properties:
        answer:
          description: '答案文本，含 `[source: ...]` 标记；拒答时恒为 `"无法回答"`'
          title: Answer
          type: string
        citations:
          description: 引用列表；`refused = false` 时必须覆盖全部事实句（覆盖率 100%）
          items:
            $ref: '#/components/schemas/Citation'
          title: Citations
          type: array
        confidence:
          description: '`low` 时前端必须标记「建议人工复核」（M3 §3 验收 6）'
          enum:
          - high
          - medium
          - low
          title: Confidence
          type: string
        kg_nodes:
          description: 支撑本次答案的图谱节点（复用 `DocumentGraphResponse.nodes` 同构模型）；拒答 / 图谱为空时为空列表
          items:
            $ref: '#/components/schemas/GraphNode'
          title: Kg Nodes
          type: array
        kg_relations:
          description: 支撑本次答案的图谱关系（复用 `DocumentGraphResponse.edges` 同构模型）；拒答 / 图谱为空时为空列表
          items:
            $ref: '#/components/schemas/GraphEdge'
          title: Kg Relations
          type: array
        kg_version:
          description: 本次检索实际使用的图谱版本（必为 active）
          title: Kg Version
          type: string
        refusal_reason:
          anyOf:
          - enum:
            - no_grounded_evidence
            - out_of_scope
            - low_confidence
            type: string
          - type: 'null'
          description: 仅 `refused = true` 时非空
          title: Refusal Reason
        refused:
          description: 是否拒答（严禁 LLM 编造引用，M3 §3 验收 3）
          title: Refused
          type: boolean
        route:
          description: 意图路由结果；`m4_affiliation` 表示已转交 M4 场景识别
          enum:
          - m3_graphqa
          - m4_affiliation
          title: Route
          type: string
        token_usage:
          anyOf:
          - $ref: '#/components/schemas/TokenUsage'
          - type: 'null'
          description: LLM token 用量；拒答分支未调用 LLM、或 LLM 未返回 usage 时为 `null`
        trace_id:
          title: Trace Id
          type: string
      required:
      - answer
      - citations
      - route
      - confidence
      - refused
      - kg_version
      - trace_id
      title: AgentQueryResponse
      type: object
    AuditLogItem:
      description: '一条审计记录（`audit_log` 行的契约投影）。


        `detail` 只含**结构化字段**（`status_code` / `method` / `path` / 路径参数），

        **不含**响应体原文——本批次不引入脱敏器，故以「不写原文」守住不新增泄露面

        （决策 **A5**）。'
      example:
        action: document.upload
        actor_id: 00000000-0000-4000-8000-000000000001
        actor_ip: 127.0.0.1
        detail:
          method: POST
          status_code: 200
        doc_id: 3f1a9c2e-7b45-4d8a-9e01-2c4f6a8b0d11
        id: 6d1e3f9a-4b2c-4a8b-8c2d-5e7f0a1b3c5d
        resource: POST /api/v1/documents/upload
        status: success
        trace_id: 5f2c1b7e-9d4a-4c1e-8f3b-6a0d2e5c7b91
        ts: '2026-09-24T10:16:12Z'
      properties:
        action:
          description: 操作类型。已登记路由取业务名（`document.upload` / `agent.query` / `affiliation.review` …）；未登记路由回落 `http.<method>.<path>`（决策 A2：宁可 action 丑，不可无记录）
          title: Action
          type: string
        actor_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: 操作者 id（系统触发时为 `null`，不编造）
          title: Actor Id
        actor_ip:
          anyOf:
          - type: string
          - type: 'null'
          description: 客户端 IP
          title: Actor Ip
        detail:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: 结构化明细；**不含**响应体原文
          title: Detail
        doc_id:
