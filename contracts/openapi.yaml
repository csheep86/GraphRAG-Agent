  /api/v1/graph/versions/{version}/activate:
    post:
      description: '把指定版本置为**可消费**并同步 Neo4j 镜像。


        **真源语义**：PG `kg_versions` 为真源，其「可消费」语义在本表中写作 `ready`；Neo4j `:KgVersion.status=''active''` 只是镜像（`superseded` 同理）。两者在本响应中同时返回，避免前端误以为存在两个状态机。


        **为什么需要显式激活（真机背景）**：建图流水线只把 PG 置 `ready`，没人同步 Neo4j 镜像，读侧于是长期命中旧导入版本。


        **错误语义**：

        - 版本不存在（PG 查不到，或 Neo4j 无该版本图数据）→ **404** `NOT_FOUND`；

        - 版本为 `pending` / `building` / `failed` → **409** `KG_VERSION_NOT_ACTIVE`；

        - Neo4j 不可用 → **501** `NOT_IMPLEMENTED`。'
      operationId: activateKgVersion
      parameters:
      - in: path
        name: version
        required: true
        schema:
          title: Version
          type: string
      - description: 【仅开发态兜底】租户 id。仅当 ALLOW_DEV_ORG_HEADER=true 且非生产环境时生效；Sprint 3 接入 M5 登录后必须移除（ADR-0003 §3.3：org_id 严禁来自 body / query）。
        in: header
        name: X-Org-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 【仅开发态兜底】租户 id。仅当 ALLOW_DEV_ORG_HEADER=true 且非生产环境时生效；Sprint 3 接入 M5 登录后必须移除（ADR-0003 §3.3：org_id 严禁来自 body / query）。
          title: X-Org-Id
      - description: 【仅开发态兜底】操作者 id，缺省取 DEFAULT_ACTOR_ID；Sprint 3 起由认证态提供。
        in: header
        name: X-Actor-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 【仅开发态兜底】操作者 id，缺省取 DEFAULT_ACTOR_ID；Sprint 3 起由认证态提供。
          title: X-Actor-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KgVersionActivationResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 缺少或无法解析认证态（`UNAUTHORIZED`）
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 跨租户访问被拒（`FORBIDDEN`，ADR-0003 §3.3 / M5 §3 验收 1）
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 指定的 `kg_version` 不存在（`NOT_FOUND`）：PG `kg_versions` 真源表中查不到该 (org_id, version)，或 Neo4j 侧没有该版本的图数据。复用`ErrorCode.NOT_FOUND`，**不**新增错误码。
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 指定的 `kg_version` 非 active（`KG_VERSION_NOT_ACTIVE`）。**严禁静默降级**到最新 active 版本（ADR-0002 §3.2）
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 基础设施不可用（Neo4j 连接失败 / 查询超时，或 LLM 未配置、装配失败）时返回 501（`NOT_IMPLEMENTED`）
      security:
      - bearerAuth: []
      summary: 激活指定 kg_version（Sprint 6.3）
      tags:
      - graph
  /api/v1/health:
    get:
      description: '不要求认证、不返回任何业务数据。


        依赖异常时仍返回 **200**，仅把 `status` 降级为 `degraded`，避免负载均衡因单实例依赖抖动直接摘除全部流量。'
      operationId: getHealth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: 健康检查（豁免租户上下文）
      tags:
      - health
servers:
- description: 同源部署（开发默认；生产由网关注入实际域名）
  url: /
tags:
- description: 健康检查。**唯一豁免租户上下文的接口**，不返回业务数据。
  name: health
- description: M1 文档接入与异步解析（上传 / 状态 / 图谱子图）。**全部要求租户上下文**。
  name: documents
- description: M3 图谱问答与可溯源引用。**全部要求租户上下文**。
  name: agent
- description: M5 审计留痕（只读查询）。写入由审计中间件统一完成，本 tag 下只有两个查询端点；**全部要求租户上下文**，返回项已按 `org_id` 过滤。
  name: audit
