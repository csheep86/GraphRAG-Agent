# CSV → 图谱的确定性映射配置（Sprint 9.5 批次 A3）
#
# 消费方：批次 B1 入图器 `backend/scripts/ingest_attendance_csv.py`
#
# 纪律：
#   1. **确定性映射，不经过 LLM**——结构化数据用 LLM 抽取是错配；
#   2. **不新建表**，直接写 Neo4j，沿用 ADR-0002 的 `kg_version` 幂等键；
#   3. 节点 / 关系模型必须与**真机现有图谱**一致（见下）。
#
# ---------------------------------------------------------------------------
# ⚠️ 标签模型（2026-09-27 核对真机后修正，初稿是错的）
#
#   初稿按「每类实体一个 Neo4j 标签」设计（:EMPLOYEE / :SHIFT / :WORK_ORDER ...）。
#   但真机图谱是**单一 :Entity 标签 + entity_type 属性**：
#     - `kg/builder.py:320`  MERGE (n:Entity {id, kg_version}) SET n.entity_type = ...
#     - `kg/builder.py:339`  MERGE (a)-[rel:RELATION {id, kg_version}]->(b)
#                            SET rel.relation_type = ...
#     - `graphs.py` 全部查询只读 `:Entity`；`_entity_type_from_properties()`
#       优先读 `entity_type`、`type` 仅作旧数据兜底
#
#   ⇒ 若用多标签，考勤数据会**进得了库、查不出来、前端渲染不出**。
#
#   本配置因此改为与 `kg/builder.py` **逐字一致**：
#     - 节点统一 `:Entity`，类型存 `entity_type`
#     - 关系统一 `:RELATION`，语义存 `relation_type`
#   查询示例：MATCH (a)-[r:RELATION {relation_type: 'ON_BUSINESS_TRIP'}]->(b)
# ---------------------------------------------------------------------------

version: 2
domain: attendance
kg_version_prefix: attendance-demo

# -- 节点 -------------------------------------------------------------------
# id 规则：`<ENTITY_TYPE>:<业务主键值>`，保证跨类型全局唯一
nodes:
  - entity_type: EMPLOYEE
    file: employees.csv
    id_from: employee_id
    properties: [name, department, position, work_time_system, hire_date, status]

  # 以下三类由 employees.csv 的**列值去重派生**，不单独建 CSV
  - entity_type: DEPARTMENT
    file: employees.csv
    id_from: department
    derive: distinct
    properties: []

  - entity_type: POSITION
    file: employees.csv
    id_from: position
    derive: distinct
    properties: []

  - entity_type: WORK_TIME_SYSTEM
    file: employees.csv
    id_from: work_time_system
    derive: distinct
    properties: []

  - entity_type: SHIFT
    file: shifts.csv
    id_from: shift_id
    properties: [date, shift_type, start_time, end_time, planned_hours, is_rest_day]

  - entity_type: ATTENDANCE_RECORD
    file: attendance_records.csv
    id_from: record_id
    properties: [date, check_in, check_out, actual_hours, core_hours_present, status, is_rest_day]

  - entity_type: BUSINESS_TRIP
    file: business_trips.csv
    id_from: trip_id
    properties: [destination, site, start_date, end_date, purpose, status]

  - entity_type: WORK_ORDER
    file: work_orders.csv
    id_from: order_id
    properties: [customer, site, dispatched_at, closed_at, status, fault_type]

  - entity_type: LOCATION_RECORD
    file: location_records.csv
    id_from: loc_id
    properties: [date, time, site, latitude, longitude]

  - entity_type: ACCESS_RECORD
    file: access_records.csv
    id_from: access_id
    properties: [date, in_time, out_time, gate]

  - entity_type: LEAVE
    file: leave_requests.csv
    id_from: leave_id
    properties: [leave_type, start_date, end_date, days, status]

  - entity_type: OVERTIME
    file: overtime_records.csv
    id_from: overtime_id
    properties: [date, hours, overtime_type, approved, comp_off_hours, comp_off_used_hours]

# -- 关系 -------------------------------------------------------------------
# 全部落成 `:RELATION`，语义存 `relation_type`
relationships:
  - relation_type: BELONGS_TO
    from: {entity_type: EMPLOYEE, file: employees.csv, key: employee_id}
    to: {entity_type: DEPARTMENT, file: employees.csv, key: department}

  - relation_type: HAS_POSITION
    from: {entity_type: EMPLOYEE, file: employees.csv, key: employee_id}
    to: {entity_type: POSITION, file: employees.csv, key: position}

  - relation_type: APPLIES_WORK_TIME
    from: {entity_type: POSITION, file: employees.csv, key: position}
    to: {entity_type: WORK_TIME_SYSTEM, file: employees.csv, key: work_time_system}

  - relation_type: HAS_SHIFT
    from: {entity_type: EMPLOYEE, file: shifts.csv, key: employee_id}
    to: {entity_type: SHIFT, file: shifts.csv, key: shift_id}

  - relation_type: HAS_ATTENDANCE
    from: {entity_type: EMPLOYEE, file: attendance_records.csv, key: employee_id}
    to: {entity_type: ATTENDANCE_RECORD, file: attendance_records.csv, key: record_id}

  - relation_type: ON_BUSINESS_TRIP
    from: {entity_type: EMPLOYEE, file: business_trips.csv, key: employee_id}
    to: {entity_type: BUSINESS_TRIP, file: business_trips.csv, key: trip_id}

  - relation_type: HANDLED_ORDER
    from: {entity_type: EMPLOYEE, file: work_orders.csv, key: employee_id}
    to: {entity_type: WORK_ORDER, file: work_orders.csv, key: order_id}

  - relation_type: LOCATED_AT
    from: {entity_type: EMPLOYEE, file: location_records.csv, key: employee_id}
    to: {entity_type: LOCATION_RECORD, file: location_records.csv, key: loc_id}

  - relation_type: SWIPED_AT
    from: {entity_type: EMPLOYEE, file: access_records.csv, key: employee_id}
    to: {entity_type: ACCESS_RECORD, file: access_records.csv, key: access_id}

  - relation_type: SUBMITTED_LEAVE
    from: {entity_type: EMPLOYEE, file: leave_requests.csv, key: employee_id}
    to: {entity_type: LEAVE, file: leave_requests.csv, key: leave_id}

  - relation_type: ACCUMULATED_OVERTIME
    from: {entity_type: EMPLOYEE, file: overtime_records.csv, key: employee_id}
    to: {entity_type: OVERTIME, file: overtime_records.csv, key: overtime_id}

  # 跨域：出差 ↔ 售后工单（按 员工 + 日期窗口 匹配，非外键）
  - relation_type: TRIP_FOR_ORDER
    from: {entity_type: BUSINESS_TRIP, file: business_trips.csv, key: trip_id}
    to: {entity_type: WORK_ORDER, file: work_orders.csv, key: order_id}
    match: {by: [employee_id], where: "order.closed_at 落在 trip.start_date ~ trip.end_date 内"}

  # 考勤记录 ↔ 其所对应的排班（同 员工 + 同日期）
  - relation_type: OCCURRED_ON
    from: {entity_type: ATTENDANCE_RECORD, file: attendance_records.csv, key: record_id}
    to: {entity_type: SHIFT, file: shifts.csv, key: shift_id}
    match: {by: [employee_id, date]}

# -- 不由 CSV 建立、需与 M2 抽取结果汇合（批次 B3）--------------------------
#
# POLICY_CLAUSE 来自 4 份制度文档经 M1 解析 + M2 抽取，不由本映射产生。
# 汇合关系（同样落 :RELATION）：
#
#   WORK_TIME_SYSTEM -[:RELATION {relation_type: 'GOVERNED_BY'}]-> POLICY_CLAUSE
#     匹配：条款正文中出现该工时制名称（标准/综合计算/不定时工作制）
#
# B3 验收路径：
#   (:Entity {entity_type:'EMPLOYEE'})
#     -[:RELATION {relation_type:'HAS_POSITION'}]->(:Entity {entity_type:'POSITION'})
#     -[:RELATION {relation_type:'APPLIES_WORK_TIME'}]->(:Entity {entity_type:'WORK_TIME_SYSTEM'})
#     -[:RELATION {relation_type:'GOVERNED_BY'}]->(:Entity {entity_type:'POLICY_CLAUSE'})
