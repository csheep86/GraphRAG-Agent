[project]
name = "backend"
version = "1.0.0"
description = "GraphRAG-Agent 后端服务（Sprint 1：契约骨架 + 可运行）"
readme = "README.md"
authors = [
    { name = "csheep86", email = "223090435+csheep86@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-multipart>=0.0.12,<1.0",
    "sqlalchemy>=2.0.35,<3.0",
    "pyyaml>=6.0,<7.0",
    "loguru>=0.7,<1.0",
    "tenacity>=9.1.4",
    "neo4j>=6.3.1",
    "langchain-openai>=1.6.2",
]

[project.scripts]
backend = "backend:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 行宽交由 `ruff format` 负责；中文契约描述串无法自动折行，故关闭 E501
ignore = ["E501"]
