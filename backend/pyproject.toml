[project]
name = "backend"
version = "1.0.0"
description = "GraphRAG-Agent 后端服务（Sprint 1：契约骨架 + 可运行）"
readme = "README.md"
authors = [
    { name = "csheep86", email = "223090435+csheep86@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-multipart>=0.0.12,<1.0",
    "sqlalchemy>=2.0.35,<3.0",
    "pyyaml>=6.0,<7.0",
    "loguru>=0.7,<1.0",
    "tenacity>=9.1.4",
    "neo4j>=6.3.1",
    "langchain-openai>=1.6.2",
    "httpx>=0.27,<1.0",
    "slowapi>=0.1.10",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
backend = "backend:main"

[dependency-groups]
dev = [
    "pypdf>=5.0,<6.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.7,<1.0",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    # 依赖**本机才有**的东西（未入库的真机产物 / 需 URI 与口令的真机 Neo4j）。
    # 这些用例在 CI 上必然 skip——注册成 marker 而不是各自散着写 skipif，
    # 是为了让 CI 能把它们挑出来**单独跑一遍并打印 skip 原因**：
    # 目的只有一个：不许出现"看着绿、其实没跑"。
    "local_only: 仅本机可跑（依赖未入库的真机产物或真机连接），CI 上必然 skip 并显式登记",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# migrations/ 由 alembic autogenerate 生成（Union / import 顺序不按本项目风格），
# 人工审阅入库，不进 lint；等价性由 tests/test_migrations_baseline.py 钉死
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 行宽交由 `ruff format` 负责；中文契约描述串无法自动折行，故关闭 E501
ignore = ["E501"]
