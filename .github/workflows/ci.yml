# CI 流水线（Sprint 1 / 阶段 3.3）
#
# 四个 job，任一失败即整条流水线红：
#   1. backend  : Ruff 静态检查 + 格式检查 + 接缝纪律门禁（check_seams.py）+ Pytest（行为与契约测试）
#   2. frontend : ESLint + TypeScript 类型检查 + `npm run gen:api` 可执行性冒烟
#   3. contract : 契约漂移门禁（关键）
#                 a. 后端侧 `export_openapi.py --check` 校验 contracts/openapi.yaml
#                 b. 前端侧 `gen:api` 后 `git diff --exit-code` 校验 src/types/api.d.ts
#   4. ci-summary: 汇总各 job 结果到 Step Summary，失败时输出失败摘要并非零退出
#
# 换行符策略：仓库统一以 LF 存储（根 .gitattributes: `* text=auto eol=lf`）。
# Ubuntu runner 天然 LF；`export_openapi.py --check` 另做 CRLF 归一化兜底，
# 因此 Windows 本地与 CI 的校验结论一致，不会出现「本地绿、CI 红」的换行符假阳性。

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：只读仓库内容
permissions:
  contents: read

# 同一分支的新推送取消旧的未完成运行，避免排队浪费
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 backend/.python-version 保持一致，避免 CI 与本地解释器版本漂移
  PYTHON_VERSION: "3.11"
  # next@16.3.5 的 engines 为 node>=20.9.0；CI 统一使用 22 LTS，与根 .nvmrc 保持一致。
  # 本地实测跑通版本为 v24.21.0，同样满足该 engines 约束。
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # 1. 后端：静态检查 + 测试
  # ---------------------------------------------------------------------------
  backend:
    name: 后端（ruff + pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # 工作目录固定为 backend/，使裸 `ruff check .` 等价于根目录的
        # `ruff check backend/`（uv 需要以项目根为工作目录才能读到 pyproject.toml）
        working-directory: backend

    # DR-B2 / G-8：pytest 必须跑在 PostgreSQL **16.x** 上，不是 SQLite。
    # 在 SQLite 上跑通的"租户隔离"什么都不证明——它没有 RLS，也没有 SET LOCAL
    # （ADR-0003 §4.1）。本 job 之前**没有任何 services 块**。
    #
    # ⚠️ **三方必须一致**，改任一处都要改另外两处：
    #   ① 这里的 POSTGRES_DB         = graphrag_test
    #   ② 这里的 DATABASE_URL 库名   = graphrag_test
    #   ③ backend/tests/conftest.py 的 _TEST_DATABASE_URL 回落库名 = graphrag_test
    services:
      postgres:
        # tag 固定且与 deploy/docker-compose.yml 的 postgres 服务一致：
        # G-8 会真连上去核对 server_version 是 16.x，两侧漂移会在那里被叫住。
        image: postgres:16-alpine
        env:
          POSTGRES_USER: graphrag
          POSTGRES_PASSWORD: graphrag
          POSTGRES_DB: graphrag_test
        ports:
          - 5432:5432
        # health check 是 runner 判断服务就绪的**唯一依据**：没有它，steps 会在
        # PG 还在初始化时就开跑，表现为一连串 "connection refused" 式的随机红。
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # **P3-B（2026-10-04）：图谱侧隔离必须由 CI 真验**（基线 §303 / G-9）。
      # 在此之前「CI 无 Neo4j」是**公开登记的事实**，图谱隔离只能靠**独立环境留证**——
      # 而留证是不能复算的：谁都能说自己跑过。加了它，图谱侧用例才从「留证」
      # 升格为**真 CI 必过**（本工程项与 **G-25** 共用，见 `changes/P3-B/proposal.md` §3）。
      neo4j:
        # tag 固定且**与 deploy/docker-compose.yml 的 neo4j 服务一致**（同 PG 的纪律）：
        # 两侧漂移由 `test_g9_0_ci_has_neo4j_service` 判红——CI 与生产跑不同版本的图库，
        # 等于"在另一个产品上验的隔离"。
        image: neo4j:5.26-community
        env:
          # ⚠️ 这是**一次性 CI 容器**的口令，不是密钥（jobs 结束即销毁）。
          # 与下面 job env 的 GRAPH_REAL_NEO4J_PASSWORD **必须一致**，改一处要改两处。
          NEO4J_AUTH: neo4j/ci-graph-pw-2026
        ports:
          - 7687:7687
        # Neo4j 冷启动**明显**慢于 PG（要建库 / 起 Bolt）⇒ start-period 给足，
        # 否则 runner 会在它还没起来时就判失败，表现为整批图谱用例随机红。
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-graph-pw-2026 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 60s

    env:
      # 放 **job 级**而不是 Pytest 那一个 step：本 job 里「本地独占用例」那一步
      # 也要连库。只塞进单个 step 会让那一步悄悄退化成"看着像跑了、其实没跑"。
      #
      # **P3-A（2026-10-04）：业务测试一律走受限角色 ``app_rls``**（裁决 4）。
      # 服务容器里的 ``POSTGRES_USER=graphrag`` 是**超级用户**，超级用户**绕过一切
      # RLS** ⇒ 用它跑业务测试，等于 T1 / T2 / G-26 全部在"没装 RLS"的前提下
      # 通过——绿得毫无意义。故：
      #   - ``DATABASE_URL``        = app_rls（受限，NOBYPASSRLS）跑业务；
      #   - ``DATABASE_URL_OWNER``  = app_owner 建表 / 迁移 / 落策略。
      # 两个角色 + 受控系统函数由下面的「建 RLS 角色」步骤建立（须超级用户）。
      DATABASE_URL: postgresql+psycopg://app_rls:app_rls@localhost:5432/graphrag_test
      DATABASE_URL_OWNER: postgresql+psycopg://app_owner:app_owner@localhost:5432/graphrag_test

      # **P3-B：图谱用例的「真连接」开关**——**刻意不用** ``NEO4J_URI``。
      # conftest 把 ``NEO4J_URI`` 固定指向不可达端口（``bolt://127.0.0.1:1``），
      # 让绝大多数用例**确定性降级**为"图谱不可用"；一旦在这里把它指向真 Neo4j，
      # 上千条与图谱无关的用例会跟着去连真实图库 ⇒ 结果随外部依赖漂移（CI 必挂）。
      # 故真图用例**单独**走这三个变量（缺任一个 ⇒ CI 上 fail，不许 skip）。
      GRAPH_REAL_NEO4J_URI: bolt://localhost:7687
      GRAPH_REAL_NEO4J_USER: neo4j
      # 与上面 services.neo4j 的 NEO4J_AUTH **必须一致**（一次性容器，非密钥）
      GRAPH_REAL_NEO4J_PASSWORD: ci-graph-pw-2026

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 接缝门禁的 Prompt 判据要与"上一次推送的样子"做 diff，浅克隆（默认 depth=1）
          # 拿不到基准提交。这里取全历史，下面再把 base 显式传进去。
          fetch-depth: 0

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: 安装 Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 同步依赖（严格使用 uv.lock）
        run: uv sync --all-groups --frozen

      # P3-A（2026-10-04 / 裁决 4）：RLS 的**前提**只能由超级用户建立一次——
      # 应用账号不是表 owner、且 ``NOBYPASSRLS``，它自己既建不出角色也改不了表。
      # 本步骤就是那"一次"：建 owner / 受限角色 / A6-A7 受控系统函数，并落策略。
      #
      # ⚠️ 少了这一步，业务测试会以超级用户身份跑 ⇒ RLS 从未被验证，
      # 而 G-26 判据 4 会把它叫住（rolbypassrls / rolsuper 断言）。
      - name: 建 RLS 角色与受控系统函数（须超级用户）
        run: |
          uv run python scripts/init_rls_roles.py \
            --admin-url postgresql+psycopg://graphrag:graphrag@localhost:5432/graphrag_test

      - name: Ruff 静态检查
        run: uv run ruff check .

      - name: Ruff 格式检查
        run: uv run ruff format --check .

      # 版本闸门：未到期项只记 WARN，不阻塞开发；越界（登记外实现）与预留字段泄进契约
      # 始终判 ERROR。Sprint 收尾验收用**默认档**（要求 ERROR = 0）即可；`--strict` 是 v1.4.0 完成点
      # 的口径，不适用于常规 Sprint（依据计划文档 §4.3 / §7.2 R9）。
      # 注：v2.3 此处曾误写作「收尾验收请手工执行 --strict」，与其所引的 §4.3 / §7.2 矛盾，已校正。
      # Prompt 判据必须显式给基准：默认 HEAD 在 CI 上恒绿（工作区恒干净），
      # 等于这条判据从未在流水线上生效过（CI 日志实测打印 `Prompt 判据基准：HEAD`）。
      # 现在反过来：脚本会自动把"自行退化成 HEAD"判为 ERROR，不传 --base 就会红。
      - name: 接缝纪律门禁（check_seams.py）
        env:
          # push：比"推送前的 HEAD"；PR：比 PR 的 base 分支
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE:-}"
          # 首次推送时 github.event.before 是全 0 SHA（无上一个提交可比），退回 HEAD~1
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse --verify --quiet HEAD~1 || true)"
            [ -z "$base" ] && echo "::notice::无可用 diff 基准（首个提交），Prompt 判据按 HEAD 口径执行"
          fi
          echo "Prompt 判据基准 = ${base:-HEAD}"
          uv run python scripts/check_seams.py --base "${base:-HEAD}"

      # G-15：补丁（版本号第三位）变更 ⇒ contracts/openapi.yaml 必须**零 diff**。
      # 与契约漂移门禁（job 3）的分工：那边管"契约与 Pydantic 模型是否一致"，
      # 本条管"补丁期**根本不许改契约**"——改了模型并同步导出契约，那边会通过，
      # 而客户插件可能因此失效，只有本条拦得住。
      # 基准计算与 check_seams 同款；取不到基准 / 非 PATCH 变更时脚本自行判为
      # "不适用"并退 0，不把流水线变成噪音（但会打印原因，不沉默）。
      - name: 补丁期契约冻结（G-15）
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse --verify --quiet HEAD~1 || true)"
          fi
          echo "G-15 基准 = ${base:-HEAD}"
          uv run python scripts/check_patch_contract_freeze.py --base "${base:-HEAD}"

      # `-rs`：把 skip **原因**打进日志。只用 `-q` 时，"本地 3 skip / CI 5 skip"
      # 这种差异在日志里完全无痕——依赖未入库产物的用例会悄悄地一次都没跑过。
      #
      # **G-25（P3-E）+ A8（P6-A）：导入受控种子语料**。
      # 评测判据要"出真值"，前提是图库里有**可复现**的数据——用"某次真机留下的库"
      # 不行（谁知道里面是什么）。语料由**生成器**产出（seed 固定 ⇒ 字节级可复现）：
      # `demo/affiliation/generated/`，规模 200 合同 / 500 发票 / 100 凭证 / 20 组植入
      # （spec §3 验收 6；v1 手工语料只有 8/60/30/9，**统计上判不出达标**）。
      #
      # ⚠️ 少了这一步，下一个 gate 步骤会因**空图**判红——那正是 G-25 判据 ⑤ 想要的
      # （空图 ⇒ 检测到 0 疑点 ⇒ 召回 0 ⇒ 假红，此时必须 fail 而不是 pass）。
      - name: 导入受控种子语料（G-25 + A8：评测需可复现的图数据）
        env:
          # 脚本读的是 settings，不是 GRAPH_REAL_*（那三个只给**测试**用）
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: ci-graph-pw-2026
        run: |
          uv run python scripts/ingest_affiliation_sources.py --purge \
            --corpus-dir demo/affiliation/generated \
            --kg-version affiliation-demo-v2

      # DATABASE_URL 取自本 job 级 env（指向 services.postgres 的 graphrag_test）；
      # 本地复现同样需要它，命令在本 job 末尾的失败摘要里。
      - name: Pytest
        run: uv run pytest -q -rs

      # **G-25（P3-E）：C2-a / C2-b 进 CI 成真门禁**——**只判不退化**（基线 delta + 容差），
      # **不判达标**（阈值的达标判定归 P6，且要等 A8 扩标后才可宣称）。
      #
      # 为什么能进 CI：这两条走 `AffiliationService().detect()`，**只读 Neo4j、
      # 零 LLM、零 HTTP**（P0-m6-eval 实测 2.72 秒）⇒ 不需要 LLM key，也不会因为
      # 模型输出抖动而 flaky。
      #
      # ⚠️ 用真机输出快照离线复算是**拦不住退化**的：算法坏了、喂的还是旧快照 ⇒
      # 算出来还是旧值。所以必须真跑。
      - name: C2-a / C2-b 评测门禁（G-25：只判不退化）
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: ci-graph-pw-2026
        run: |
          uv run python scripts/eval_acceptance.py --live --gold v2 \
            --criteria c2_a_hidden_relation_recall,c2_b_false_positive_rate \
            --gate

      # 护栏状态快照：**只打日志，不做门禁**（它恒退 0，门禁由 pytest 承担）。
      #
      # 为什么要多这一步：护栏一大半是 xfail 骨架，**CI 全绿 ≠ 它们在拦**。
      # 若只在本地看，很容易出现「文档标 ✅ / 实际没在拦」的认知漂移。
      # 把三档状态写进每次提交的日志，谁想确认都不必回忆。
      - name: 护栏状态快照（仅报告，非门禁）
        run: uv run python scripts/check_startup_readiness.py

      # 依赖本机产物 / 真机连接的用例在 CI 上必然 skip；单独跑一遍是为了让这件事
      # **写在日志里**而不是留在沉默里。数量变化（不再是全部 skip）说明环境变了。
      - name: 本地独占用例（CI 上必 skip，仅做可见登记）
        run: |
          echo "::group::以下用例依赖本机产物/真机连接，CI 上不执行（不构成门禁结论）"
          uv run pytest -rs -m local_only || true
          echo "::endgroup::"

      - name: 失败摘要
        if: failure()
        run: |
          {
            echo "## 后端 Job 失败"
            echo ""
            echo "- 提交: \`${{ github.sha }}\`"
            echo "- 触发: \`${{ github.event_name }}\` @ \`${{ github.ref_name }}\`"
            echo "- 复现命令（backend/ 目录下）:"
            echo "  - \`uv sync --all-groups\`"
            echo "  - 起测试库（G-8 要求 PostgreSQL 16.x，本地与 CI 同 tag）:"
            echo "    \`docker run --rm -d -e POSTGRES_USER=graphrag -e POSTGRES_PASSWORD=graphrag -e POSTGRES_DB=graphrag -p 5432:5432 postgres:16-alpine\`"
            echo "  - 建 RLS 角色与策略（P3-A：业务测试走受限角色，超级用户会绕过 RLS）:"
            echo "    \`uv run python scripts/init_rls_roles.py --admin-url postgresql+psycopg://graphrag:graphrag@localhost:5432/graphrag_test\`"
            echo "  - 起图谱库（P3-B：G-9 图谱侧用例要**真** Neo4j，与 deploy 同 tag）:"
            echo "    \`docker run --rm -d -e NEO4J_AUTH=neo4j/ci-graph-pw-2026 -p 7687:7687 neo4j:5.26-community\`"
            echo "  - 真图用例的连接开关（缺它 ⇒ 图谱用例 skip；CI 上由 job env 注入）:"
            echo "    \`GRAPH_REAL_NEO4J_URI=bolt://localhost:7687 GRAPH_REAL_NEO4J_PASSWORD=ci-graph-pw-2026\`"
            echo "  - **G-25 评测门禁**（受控语料 ⇒ 真跑 C2-a / C2-b，只判不退化）:"
            echo "    \`uv run python scripts/ingest_affiliation_sources.py --purge --corpus-dir demo/affiliation/generated --kg-version affiliation-demo-v2\`"
            echo "    \`uv run python scripts/eval_acceptance.py --live --gold v2 --criteria c2_a_hidden_relation_recall,c2_b_false_positive_rate --gate\`"
            echo "    ⚠️ 基线值在 \`backend/data/eval/baselines/ci-c2-v2.json\`；**刷基线即重设门禁刻度**。"
            echo "  - \`uv run ruff check . && uv run ruff format --check .\`"
            echo "  - \`uv run python scripts/check_seams.py\`（接缝纪律门禁；Sprint 收尾用默认档 ERROR=0，\`--strict\` 属 v1.4.0 完成点）"
            echo "  - \`uv run pytest -q\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. 前端：lint + 类型生成可执行性
  # ---------------------------------------------------------------------------
  frontend:
    name: 前端（lint + gen:api）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（严格使用 package-lock.json）
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 生成 Next 类型声明（next-env.d.ts 被 gitignore，CI 检出后需先生成）
        run: npm exec next typegen

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 生成 API 类型（可执行性冒烟）
        run: npm run gen:api

      - name: 失败摘要
        if: failure()
        run: |
          {
            echo "## 前端 Job 失败"
            echo ""
            echo "- 提交: \`${{ github.sha }}\`"
            echo "- 触发: \`${{ github.event_name }}\` @ \`${{ github.ref_name }}\`"
            echo "- 复现命令（frontend/ 目录下）:"
            echo "  - \`npm ci\`"
            echo "  - \`npm run lint\`"
            echo "  - \`npm exec next typegen && npm run typecheck\`"
            echo "  - \`npm run gen:api\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. 契约校验（关键）：前后端生成物都不得偏离 contracts/openapi.yaml
  # ---------------------------------------------------------------------------
  contract:
    name: 契约校验（前后端漂移门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # --- 3a. 后端侧：契约文件 vs Pydantic 模型 ---
      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: 安装 Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 同步后端依赖（严格使用 uv.lock）
        working-directory: backend
        run: uv sync --all-groups --frozen

      - name: 后端契约校验（export_openapi.py --check）
        working-directory: backend
        run: |
          set +e
          uv run python scripts/export_openapi.py --check > openapi.log 2>&1
          code=$?
          cat openapi.log
          if [ "$code" -ne 0 ]; then
            # 重新生成并输出与仓库版本的差异：契约漂移在 CI 上最难定位，
            # 远端日志不可下载时这份 diff 是唯一的现场证据（CI #9 教训）。
            uv run python scripts/export_openapi.py > /dev/null 2>&1
            echo "---------- 契约漂移详情 ----------"
            git -C .. --no-pager diff -- contracts/openapi.yaml
          fi
          exit $code

      # --- 3b. 前端侧：TS 类型 vs contracts/openapi.yaml ---
      - name: 安装 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖（严格使用 package-lock.json）
        working-directory: frontend
        run: npm ci

      - name: 重新生成前端类型
        working-directory: frontend
        run: npm run gen:api

      - name: 前端类型漂移校验（git diff --exit-code）
        run: |
          if ! git diff --exit-code -- frontend/src/types/api.d.ts; then
            echo "::error file=frontend/src/types/api.d.ts::生成的类型与 contracts/openapi.yaml 不一致，请在 frontend/ 执行 npm run gen:api 并提交生成物"
            echo ""
            echo "---------- 漂移详情 ----------"
            git --no-pager diff -- frontend/src/types/api.d.ts
            exit 1
          fi
          echo "契约校验通过：contracts/openapi.yaml 与前后端生成物一致"

      - name: 失败摘要
        if: failure()
        run: |
          {
            echo "## 契约校验 Job 失败"
            echo ""
            echo "- 提交: \`${{ github.sha }}\`"
            echo "- 触发: \`${{ github.event_name }}\` @ \`${{ github.ref_name }}\`"
            echo "- 失败原因通常是契约漂移，修复路径（严格遵守契约同步铁律）:"
            echo "  1. 若改了请求/响应字段：先改 \`backend/app/schemas/\` 的 Pydantic 模型"
            echo "  2. \`cd backend && uv run python scripts/export_openapi.py\` 重新导出契约"
            echo "  3. \`cd frontend && npm run gen:api\` 重新生成 TS 类型"
            echo "  4. 把 \`contracts/openapi.yaml\` 与 \`frontend/src/types/api.d.ts\` 一并提交"
            echo "- 禁止手工编辑上述两个生成物。"
            echo "- 当前工作区差异:"
            echo '  ```'
            git status --short | sed 's/^/  /'
            echo '  ```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 4. 汇总：无论成功失败都写出一份结果摘要；失败时非零退出
  # ---------------------------------------------------------------------------
  ci-summary:
    name: 流水线汇总
    runs-on: ubuntu-latest
    needs: [backend, frontend, contract]
    if: always()
    steps:
      - name: 输出各 Job 结果
        run: |
          {
            echo "## CI 结果汇总"
            echo ""
            echo "- 提交: \`${{ github.sha }}\`"
            echo "- 触发: \`${{ github.event_name }}\` @ \`${{ github.ref_name }}\`"
            echo ""
            echo "| Job | 结果 |"
            echo "| --- | --- |"
            echo "| backend | ${{ needs.backend.result }} |"
            echo "| frontend | ${{ needs.frontend.result }} |"
            echo "| contract | ${{ needs.contract.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败摘要
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          {
            echo ""
            echo "### 失败摘要"
            echo ""
            echo "存在未通过的 Job，流水线判定为失败。请查看上方表格中结果非 \`success\` 的 Job 日志，"
            echo "并参考该 Job 的失败摘要定位复现命令。"
            echo ""
            echo "常见原因对照："
            echo ""
            echo "| 失败 Job | 常见原因 |"
            echo "| --- | --- |"
            echo "| backend | 静态检查告警、代码未格式化、接缝门禁报错（登记外实现 / 预留字段泄进契约）、测试失败 |"
            echo "| frontend | ESLint 报错、openapi-typescript 执行失败 |"
            echo "| contract | 改了后端模型但未重新导出契约，或未运行 \`npm run gen:api\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::CI 未通过，详见 Step Summary"
          exit 1
