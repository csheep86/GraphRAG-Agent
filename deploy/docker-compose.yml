# D-1 容器化（Sprint 10.3 / CP-D0）— 单机交付的**唯一安装入口**
#
# 规格出处：`docs/deployment-spec.md` §1.1（编排文件 = 唯一入口）、§2（组件清单）、§2 注（PG / Neo4j 端口不对外）
#
# ⚠️ **裁决 D-L 已作废（2026-10-01）**
#    原文：不引入 PG 容器，理由是「起一个**没有任何组件连接**的 PG 就是假组件」。
#    该前提已被 **DR-B1** 推翻——裁决（2026-10-01）：**开发 / 测试 / 生产一律
#    PostgreSQL 16.x，不再用 SQLite 作替身**（见需求基线 DR-B1 / DR-B3）。
#    ⇒ 本文件里的 SQLite 是**待替换的过渡态**，**不是**被批准的方案。
#    ⇒ 切换动作归 **P1**（DR-B1 / DR-B3 / G-8 / G-20），排期见 `docs/delivery-plan.md`。
#    ⇒ **不要在 P1 完成前先把这里改成 PG**：那会得到一个没应用连的 PG 服务，
#      恰恰就是当初 D-L 要防的"假组件"。**正确顺序**：先让 backend 默认连 PG
#      （`config.py` + `.env.example` 实测通过），**再**改本文件。
#
# ⚠️ **尚未满足 G-19（DR-A6 版本化镜像）**
#    backend / frontend 目前只有 `build:`、**没有 `image:`** ⇒ 现场无法 pull 升级、
#    也无法改 tag 回滚 ⇒ 离线包（DR-A7）与补丁流程（DR-C2）**都还不存在**。
#    护栏：`backend/tests/test_guardrails_delivery.py::test_g19_compose_uses_versioned_images`
#    （当前 xfail；开工状态一律以 `check_startup_readiness.py` 的输出为准，别看本文注释）。
#
# 使用：`cp .env.example .env` → 填 NEO4J_PASSWORD → `docker compose up -d`
# （详见同目录 README.md）

name: graphrag-agent

services:
  neo4j:
    # tag 固定（D-N）：`:latest` 是不可复现的同义词——本机曾靠它占了 1.14GB 却没人在用
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD 必填，见 .env.example}
    # §2「PG / Neo4j 禁止暴露到业务网络」⇒ 只绑回环
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      # 镜像还声明了 `/logs`；不显式挂 ⇒ Docker 自建**匿名卷**（排障时不知道是谁的、
      # 备份也漏项）。规格 §6.1「备份对象缺一不可复现」⇒ 一律显式命名
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"${NEO4J_PASSWORD}\" 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  backend:
    build:
      # context 用 backend/ 自身（不是仓库根）：COPY 路径即 Dockerfile 内所写，`.dockerignore` 也生效
      context: ../backend
      dockerfile: Dockerfile
    environment:
      # ⚠️ 过渡态（DR-B1 已裁决弃用 SQLite）：P1 切 PG 时，本项与 `sqlite_data` 卷一并替换。
      # 详见文件头「裁决 D-L 已作废」。四斜杠 = named volume 内的绝对路径。
      DATABASE_URL: sqlite:////data/dev.db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      # 必须全大写：`case_sensitive=False` 让小写写法（`NEO4J_password`）侥幸可用，
      # 但一旦收紧大小写就**静默连不上**（症状是图谱功能全废、healthcheck 却仍绿）。
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      CORS_ALLOW_ORIGINS: '["http://127.0.0.1:3000","http://localhost:3000"]'
      # §3 生产默认值：私域禁外发，生产不得为 false
      PRIVATE_DEPLOY_ENABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sqlite_data:/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      # 契约路径是 `/api/v1/health`（不是 /health）：backend/app/api/v1/routes/health.py
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # R18 红线：`NEXT_PUBLIC_USE_MOCK` 默认 true ⇒ 不置 false 则容器化前端静默走 Mock
        NEXT_PUBLIC_USE_MOCK: "false"
        NEXT_PUBLIC_APP_ENV: production
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  # ⚠️ 过渡态卷：DR-B1 裁决后失去意义，P1 切 PG 时随 SQLite 一并删除
  sqlite_data:
  # PG 位（**P1** 切 PG / DR-B1 时启用，届时替代 sqlite_data）：
  # pg_data:
