# D-1 容器化（Sprint 10.3 / CP-D0）— 单机交付的**唯一安装入口**
#
# 规格出处：`docs/deployment-spec.md` §1.1（编排文件 = 唯一入口）、§2（组件清单）、§2 注（PG / Neo4j 端口不对外）
#
# ✅ **裁决 D-L 已作废（2026-10-01），且 P1 已完成切换**
#    原文：不引入 PG 容器，理由是「起一个**没有任何组件连接**的 PG 就是假组件」。
#    该前提已被 **DR-B1** 推翻——裁决（2026-10-01）：**开发 / 测试 / 生产一律
#    PostgreSQL 16.x，不再用 SQLite 作替身**（见需求基线 DR-B1 / DR-B3）。
#    切换按 D-L 当年防的那个顺序完成：**先**让 backend 默认连 PG 并实测跑通
#    （`config.py` + `.env.example`），**才**在本文件引入 PG 服务 ⇒ 这个 PG
#    是**真有应用连的**，不是假组件。SQLite 配置与 `sqlite_data` 卷已一并清除。
#
# ✅ **G-19（DR-A6 版本化镜像）已达成（2026-10-01）**
#    backend / frontend 均已声明固定 tag 的 `image:`（构建产物自动打此 tag）⇒ 现场
#    可 pull 升级、可改 tag 回滚；离线包（DR-A7）与补丁流程（DR-C2）的前提已就位。
#    护栏已转正（摘 xfail）：`test_g19_compose_uses_versioned_images`。
# ✅ **tag 漂移已受拦（2026-10-01，决策点 1 采纳 (a)）**：
#    tag 与 `config.py` 的 `app_version` 仍**没有自动联动**（发版仍须手工改这里），
#    但漏改不再沉默——`test_g19_own_image_tags_track_app_version` 会判红。
#    （负向验证已做：把下面 backend 的 tag 改成 1.5.9，该用例即 FAIL。）
#    真实护栏状态一律以 `check_startup_readiness.py` 的输出为准，别只看本文注释。
#
# 使用：`cp .env.example .env` → 填 NEO4J_PASSWORD → `docker compose up -d`
# （详见同目录 README.md）

name: graphrag-agent

# **backend 镜像的构建参数（`db-init` 与 `backend` 共用同一份）**。
# 用锚点是**刻意**的：两处各写一份 `context: ..` 的话，哪天改 Dockerfile 路径
# 只改一处 ⇒ 另一处变成"能构建、但构建的是旧配置"，而 compose 不会报错。
x-backend-build: &backend-build
  # ✅ **context 改为仓库根（2026-10-04，P2.5 / E3）**：插件目录 `plugins/` 在仓库根，
  #    而 `backend/Dockerfile` 要 `COPY plugins ./plugins` 才能把插件烘焙进镜像
  #    （ADR-0007 §3.1：构建期烘焙）⇒ context 留在 `backend/` 的话该 COPY **无源**。
  # ⚠️ **副作用已处置**：`backend/.dockerignore` 随 context 变更而失效（Docker 只认
  #    context 根的 `.dockerignore`）⇒ 已新建**仓库根 `.dockerignore`** 接管，
  #    且必须含 `.env` 排除（`deployment-spec.md` §3 密钥禁入镜像）。
  context: ..
  dockerfile: backend/Dockerfile

services:
  neo4j:
    # tag 固定（D-N）：`:latest` 是不可复现的同义词——本机曾靠它占了 1.14GB 却没人在用
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD 必填，见 .env.example}
    # §2「PG / Neo4j 禁止暴露到业务网络」⇒ 只绑回环
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      # 镜像还声明了 `/logs`；不显式挂 ⇒ Docker 自建**匿名卷**（排障时不知道是谁的、
      # 备份也漏项）。规格 §6.1「备份对象缺一不可复现」⇒ 一律显式命名
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"${NEO4J_PASSWORD}\" 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # DR-B1：关系型库。按 §2「PG / Neo4j 禁止暴露到业务网络」⇒ **不映射 ports**，
  # 需直连时用 `docker compose exec postgres psql -U graphrag -d graphrag`。
  postgres:
    # tag 固定小版本（D-N）：`:latest` 是不可复现的同义词
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: graphrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填，见 .env.example}
      POSTGRES_DB: graphrag
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrag -d graphrag"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # **P3-A 收口（2026-10-04）：建 RLS 角色 / 受控函数 / 落策略的一次性服务**。
  #
  # **为什么必须有它**：RLS 生效的前提是「应用账号**不是**表 owner、且 `NOBYPASSRLS`」
  # （ADR-0003 §3.2 要求 2），而这个前提**只能由超级用户建立一次**——应用自己建不出来。
  # 本服务就是那"一次"：以 PG 超级用户连进去，建 `app_owner`（建表 / 迁移）与
  # `app_rls`（受限，`NOBYPASSRLS`）、建 A6 / A7 的受控系统函数、建表（首次）、
  # 并对 14 张租户表落 `ENABLE` + `FORCE` + 策略。
  #
  # ⚠️ **少了它会发生什么**：`backend` 仍会照常起来（连通性没问题），但库里**没有
  # 任何策略**，而此时它连库的身份若是超级用户 ⇒ **绕过一切 RLS**，症状为零。
  # 这是"看起来部署完成、其实隔离没装"的典型，故必须有（G-26 的部署形态断言盯住）。
  #
  # 幂等：角色 / 函数 / 策略 / 建表全部可重复跑 ⇒ 每次 `up` 都执行，二次起只是 no-op。
  db-init:
    build: *backend-build
    image: graphrag-agent/backend:1.6.0
    command:
      - python
      - scripts/init_rls_roles.py
      # 超级用户连串：只在**这一个一次性服务**里出现（backend 用的是受限角色）
      - --admin-url
      - postgresql+psycopg://graphrag:${POSTGRES_PASSWORD}@postgres:5432/graphrag
      # 首次部署时建表（owner 身份）。已存在则 no-op；**升级**仍走
      # `alembic upgrade head`（deployment-spec §7.2），本服务不改迁移历史。
      - --create-tables
    environment:
      # 【密钥】这两个口令**不写进镜像**（§3），由现场 `.env` / Secrets 注入。
      # 脚本每次都会 `ALTER ROLE … PASSWORD` ⇒ 改这里即可轮换，无需进库操作。
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?APP_OWNER_PASSWORD 必填，见 .env.example}
      APP_RLS_PASSWORD: ${APP_RLS_PASSWORD:?APP_RLS_PASSWORD 必填，见 .env.example}
    depends_on:
      postgres:
        condition: service_healthy
    # 一次性：`restart: "no"`。它退出 0 后 `backend` 才起（`service_completed_successfully`）
    restart: "no"

  backend:
    build: *backend-build
    # DR-A6（G-19）：版本化镜像。保留 build: 的同时声明 image: ⇒ 构建产物自动打此 tag，
    # 现场即可 pull 升级 / 改 tag 回滚。tag **必须固定小版本**（`:latest` 是不可复现的同义词，D-N）。
    # ⚠️ 此 tag 与 `backend/app/core/config.py` 的 `app_version`（当前 1.6.0）**无自动
    #    联动** ⇒ **发版 bump 时必须手工同步这里**；漏改由
    #    `test_g19_own_image_tags_track_app_version` 判红（2026-10-01，决策点 1 采纳 (a)）。
    image: graphrag-agent/backend:1.6.0
    environment:
      # DR-B1：连本文件的 `postgres` 服务。**必须写服务名**，不能写 localhost——
      # 容器里的 localhost 是容器自己；写错的表现是连不上，而 healthcheck 报得很含糊。
      #
      # **P3-A（2026-10-04）：连库账号必须是受限角色 `app_rls`**（`NOBYPASSRLS`）。
      # 原先这里是 `graphrag`——PG 的 `POSTGRES_USER` **就是超级用户**，而超级用户
      # **绕过一切 RLS** ⇒ 用它连库，等于把 P3-A 落的 14 张表策略当成装饰品，
      # 且**没有任何症状**（业务照常跑）。角色由上面的 `db-init` 建立。
      DATABASE_URL: postgresql+psycopg://app_rls:${APP_RLS_PASSWORD}@postgres:5432/graphrag
      # **P3-D（2026-10-04）：owner 串——迁移 / DDL 专用**。
      # 上面那串是**受限角色**（只有 DML），而 `alembic upgrade head` 跑的是 `CREATE` /
      # `ALTER` ⇒ 用它升级会直接 `permission denied`（`deployment-spec.md` §7.2）。
      # ⚠️ 少了这一行的症状**不是**"隔离失效"，而是"**部署之后升不了级**"——
      # 平时毫无症状，只在真正升级那一刻炸，故由 G-26 判据 7 机械盯住。
      DATABASE_URL_OWNER: postgresql+psycopg://app_owner:${APP_OWNER_PASSWORD}@postgres:5432/graphrag
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      # 必须全大写：`case_sensitive=False` 让小写写法（`NEO4J_password`）侥幸可用，
      # 但一旦收紧大小写就**静默连不上**（症状是图谱功能全废、healthcheck 却仍绿）。
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      CORS_ALLOW_ORIGINS: '["http://127.0.0.1:3000","http://localhost:3000"]'
      # §3 生产默认值：私域禁外发，生产不得为 false
      PRIVATE_DEPLOY_ENABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # **P3-A**：必须等 `db-init` **成功退出**（而不是"起来了"）——
      # 它在建角色 / 落策略，backend 若先跑起来就是"没装 RLS 也在对外服务"。
      # `service_completed_successfully` 保证：init 非 0 退出 ⇒ backend **不会**启动。
      db-init:
        condition: service_completed_successfully
    healthcheck:
      # 契约路径是 `/api/v1/health`（不是 /health）：backend/app/api/v1/routes/health.py
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # R18 红线：`NEXT_PUBLIC_USE_MOCK` 默认 true ⇒ 不置 false 则容器化前端静默走 Mock
        NEXT_PUBLIC_USE_MOCK: "false"
        NEXT_PUBLIC_APP_ENV: production
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    # DR-A6（G-19）：tag 固定小版本；发版时与 backend 一并同步。
    # 位置注意：必须在 `build.args` 块**之后**且与之同级（4 空格）。插在 args 中间
    #           会把剩余 ARG 挤出该块 ⇒ 整个 compose 不可解析（YAML 静默变死文件）。
    image: graphrag-agent/frontend:1.6.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  # DR-B1：关系型数据。`sqlite_data` 已于 2026-10-01 随 SQLite 一并删除。
  pg_data:
